name: Build WINK ISP Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Create deployment ZIP
        run: |
          cd dist
          zip -r ../wink-isp-final.zip .

      - name: Upload website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wink-isp-final
          path: wink-isp-final.zip
          retention-days: 7
